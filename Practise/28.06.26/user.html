<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Info</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section>
        <h2>Завдання 1</h2>

        <div class="panel">
            <div class="topbar">
                <span id="userEmail">user</span>
                <button id="exitBtn" type="button">Exit</button>
            </div>

            <div class="user-form">
                <div class="field">
                    <label>First Name:</label>
                    <input type="text" id="firstName">
                    <div class="error" id="firstNameError"></div>
                </div>

                <div class="field">
                    <label>Last Name:</label>
                    <input type="text" id="lastName">
                    <div class="error" id="lastNameError"></div>
                </div>

                <div class="field">
                    <label>Year of birth:</label>
                    <input type="number" id="birthYear" min="1900">
                    <div class="error" id="birthYearError"></div>
                </div>

                <div class="field">
                    <label>Gender:</label>
                    <select id="gender">
                        <option value="">Choose</option>
                        <option value="male">male</option>
                        <option value="female">female</option>
                    </select>
                    <div class="error" id="genderError"></div>
                </div>

                <div class="field">
                    <label>Phone number:</label>
                    <input type="text" id="phone">
                    <div class="error" id="phoneError"></div>
                </div>

                <div class="field">
                    <label>Skype:</label>
                    <input type="text" id="skype">
                    <div class="error" id="skypeError"></div>
                </div>

                <div class="field full">
                    <button id="saveBtn" type="button">Save</button>
                </div>
            </div>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
