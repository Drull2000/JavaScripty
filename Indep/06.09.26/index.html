<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function multiplyAsync(a, b) {
            return new Promise((resolve, reject) => {
                setTimeout(() => {
                    if (typeof a !== "number" || typeof b !== "number") {
                        reject(new Error("Некорректные аргументы"));
                    } else {
                        resolve(a * b);
                    }
                }, 2000);
            });
        }

        function sortArrayAsync(array) {
            return new Promise((resolve, reject) => {
                setTimeout(() => {
                    if (array.length === 0) {
                        reject(new Error("Массив пуст"));
                    } else {
                        const sortedArray = [...array].sort((a, b) => a - b);
                        resolve(sortedArray);
                    }
                }, 2000);
            });
        }

        async function main() {
            try {
                const multiplicationResult = await multiplyAsync(6, 9);
                console.log("Результат множения:", multiplicationResult);

                const sortedArray = await sortArrayAsync([5, 2, 8, 1, 3]);
                console.log("Отсортированный массив:", sortedArray);
            } catch (error) {
                console.error("Ошибка:", error.message);
            }
        }

        main();
    </script>
</body>
</html>
