<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Document</title>

<style>

body{
    font-family:Arial;
    background:#f2f2f2;
    margin:40px;
}

.container{
    width:700px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:10px;
}

input,
select,
textarea{
    width:100%;
    padding:10px;
    margin:10px 0;
    font-size:16px;
}

button{
    padding:10px 25px;
    cursor:pointer;
    font-size:16px;
}

#answer{
    margin-top:25px;
    font-size:20px;
    color:green;
}

</style>

</head>

<body>

<div class="container">

<h2>Магазин книг</h2>

<select id="book">
<option>JavaScript</option>
<option>HTML & CSS</option>
<option>Python</option>
<option>C++</option>
</select>

<input
type="number"
id="count"
placeholder="Кількість">

<input
type="text"
id="name"
placeholder="Ваше ім'я">

<input
type="date"
id="date">

<textarea
id="address"
placeholder="Адреса"></textarea>

<textarea
id="comment"
placeholder="Коментар"></textarea>

<button id="order">
Замовити
</button>

<div id="answer"></div>

</div>

<script src="fourth.js"></script>

</body>
</html>
