<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #ececec;
            padding: 30px;
        }

        .container {
            width: 900px;
            margin: auto;
            background: white;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 0 10px rgba(0,0,0,.2);
        }

        h1 {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            font-size: 16px;
        }

        button {
            margin-top: 20px;
            padding: 12px 30px;
            cursor: pointer;
            font-size: 16px;
            border: none;
            background: royalblue;
            color: white;
            border-radius: 5px;
        }

        button:hover {
            background: #214ec9;
        }

        .error {
            color: red;
            font-size: 14px;
            margin-top: 5px;
            min-height: 18px;
        }

        #colors {
            margin-top: 35px;
            display: grid;
            grid-template-columns: repeat(3,1fr);
            gap: 20px;
        }

        .card {
            border: 1px solid #ccc;
            border-radius: 10px;
            overflow: hidden;
            background: white;
        }

        .preview {
            height: 90px;
        }

        .info {
            padding: 15px;
        }

        .info p {
            margin: 6px 0;
        }
    </style>
</head>

<body>

<div class="container">

<h1>Палітра кольорів</h1>

<label>Назва кольору</label>

<input
type="text"
id="name">

<div
class="error"
id="nameError"></div>

<label>Тип</label>

<select id="type">

<option value="RGB">RGB</option>

<option value="RGBA">RGBA</option>

<option value="HEX">HEX</option>

</select>

<label>Код кольору</label>

<input
type="text"
id="code"
placeholder="Наприклад: 255,0,0">

<div
class="error"
id="codeError"></div>

<button id="save">
Save
</button>

<div id="colors">
    </div>

</div>

<script src="script.js"></script>

</body>
</html>
