<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Document</title>

<style>

body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background-color: rgb(251, 242, 233);
    font-family:Arial;
}

button{
    padding:12px 25px;
    font-size:18px;
    cursor:pointer;
}

.modal{

    position:fixed;

    left:0;
    top:0;

    width:100%;
    height:100%;

    display:none;

    justify-content:center;
    align-items:center;

    background:rgba(0,0,0,.5);

}

.window{

    width:350px;

    background:white;

    border-radius:8px;

    padding:30px;

    text-align:center;

}

.window button{

    margin-top:20px;

}

</style>

</head>
<body>

<button id="open">Відкрити</button>

<div class="modal" id="modal">

    <div class="window">

        <h2>Модальне вікно</h2>

        <p>Це текст модального вікна.</p>

        <button id="close">Закрити</button>

    </div>

</div>

<script src="second.js"></script>

</body>
</html>
