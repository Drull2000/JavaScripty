<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetch Users</title>
</head>

<body>
    <button id="get-users-btn">Get Users</button>
    <ul id="user-list"></ul>
    <form id="post-form">
        <input type="text" name="title" placeholder="Title">
        <textarea name="body" placeholder="Enter text ... "></textarea>
        <input type="hidden" value="1" name="userId">
        <button id="send-btn" type="submit">Send</button>
    </form>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const getUsersBtn = document.getElementById('get-users-btn');
            getUsersBtn.addEventListener('click', fetchUsers);

            const form = document.getElementById('post-form');
            // const sendBtn = document.getElementById('send-btn');

            form.addEventListener('submit', async (event) => {
                event.preventDefault();

                const formData = new FormData(form);
                const data = Object.fromEntries(formData.entries());
                const jsonData = JSON.stringify(data);

                try {

                    const response = await fetch("https://jsonplaceholder.typicode.com/posts", {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: jsonData

                    });
                    if (!response.ok) throw new Error('Error');

                    const result = await response.json();
                    console.log('Success', result);
                } catch (error) {
                    console.error('Error: ', error);
                };
            });
        });

        async function fetchUsers() {
            try {
                const response = await fetch('https://jsonplaceholder.typicode.com/users');

                if (!response.ok) {
                    throw new Error(`HTTP Error: ${response.status}`);
                }
                const data = await response.json();

                const userListUL = document.getElementById('user-list');

                userListUL.textContent = '';

                data.forEach(user => {
                    const listItem = document.createElement('li');
                    listItem.innerHTML = user.name;
                    userListUL.appendChild(listItem);

                });

                console.log('Users: ', data);
            } catch (error) {
                console.error("Error: ", error);
            }
        }

        fetchUsers();
    </script>
</body>

</html>
